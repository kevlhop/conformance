name: CI Conformance Map

on:
  push:
    branches:
      - main
    paths:
      - "requirements/**"
      - "tools/conformance-map/**"
      - ".github/workflows/ci-conformance-map.yml"
  pull_request:
    paths:
      - "requirements/**"
      - "tools/conformance-map/**"
      - ".github/workflows/ci-conformance-map.yml"

permissions:
  contents: read

jobs:
  test:
    name: Conformance Map
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tools/conformance-map

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/conformance-map/pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Check formatting
        run: black --check src tests

      - name: Run pylint
        run: pylint src/geisa_conformance_map
