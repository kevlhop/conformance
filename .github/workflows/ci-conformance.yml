name: CI Conformance

on:
    push:
        branches: [main]
    pull_request_target:

env:
  CQFD_VERSION: 5.10.2

jobs:
    changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            full_ci: ${{ steps.paths.outputs.full_ci }}
        steps:
            - name: Check changed paths
              id: paths
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT_NAME: ${{ github.event_name }}
                  REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  if [ "${EVENT_NAME}" != "pull_request_target" ]; then
                      echo "full_ci=true" >> "${GITHUB_OUTPUT}"
                      exit 0
                  fi

                  files="$(
                      gh api \
                          --paginate \
                          "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
                          --jq '.[].filename'
                  )"

                  full_ci=false

                  while IFS= read -r file; do
                      case "${file}" in
                          requirements/*)
                              ;;
                          tools/conformance-map/*)
                              ;;
                          .github/workflows/ci-conformance-map.yml)
                              ;;
                          *)
                              full_ci=true
                              break
                              ;;
                      esac
                  done <<< "${files}"

                  echo "full_ci=${full_ci}" >> "${GITHUB_OUTPUT}"

    shellcheck:
        needs: changes
        if: needs.changes.outputs.full_ci == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - name: Install CQFD and create docker image
              run: |
                  curl -LO https://github.com/savoirfairelinux/cqfd/releases/download/v${{ env.CQFD_VERSION }}/cqfd_${{ env.CQFD_VERSION }}_all.deb
                  sudo dpkg -i ./cqfd_${{ env.CQFD_VERSION }}_all.deb
                  cqfd init
            - name: Run shellcheck
              run: |
                  cqfd -b shellcheck

    pylint:
        needs: changes
        if: needs.changes.outputs.full_ci == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - name: Install CQFD and create docker image
              run: |
                  curl -LO https://github.com/savoirfairelinux/cqfd/releases/download/v${{ env.CQFD_VERSION }}/cqfd_${{ env.CQFD_VERSION }}_all.deb
                  sudo dpkg -i ./cqfd_${{ env.CQFD_VERSION }}_all.deb
                  cqfd init
            - name: Run pylint
              run: |
                  cqfd -b pylint

    black:
        needs: changes
        if: needs.changes.outputs.full_ci == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - name: Install CQFD and create docker image
              run: |
                  curl -LO https://github.com/savoirfairelinux/cqfd/releases/download/v${{ env.CQFD_VERSION }}/cqfd_${{ env.CQFD_VERSION }}_all.deb
                  sudo dpkg -i ./cqfd_${{ env.CQFD_VERSION }}_all.deb
                  cqfd init
            - name: Run black
              run: |
                  cqfd -b black

    clang-format:
        needs: changes
        if: needs.changes.outputs.full_ci == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - name: Install CQFD and create docker image
              run: |
                  curl -LO https://github.com/savoirfairelinux/cqfd/releases/download/v${{ env.CQFD_VERSION }}/cqfd_${{ env.CQFD_VERSION }}_all.deb
                  sudo dpkg -i ./cqfd_${{ env.CQFD_VERSION }}_all.deb
                  cqfd init
            - name: Run clang-format
              run: |
                  cqfd -b clang-format

    clang-tidy:
        needs: changes
        if: needs.changes.outputs.full_ci == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  submodules: true
            - name: Install CQFD and create docker image
              run: |
                  curl -LO https://github.com/savoirfairelinux/cqfd/releases/download/v${{ env.CQFD_VERSION }}/cqfd_${{ env.CQFD_VERSION }}_all.deb
                  sudo dpkg -i ./cqfd_${{ env.CQFD_VERSION }}_all.deb
                  cqfd init
            - name: Run clang-tidy
              run: |
                  cqfd -b clang-tidy

    on-target-tests-ssh-imx93:
        if: needs.changes.outputs.full_ci == 'true'
        uses: ./.github/workflows/ci-conformance-on-target-ssh.yml
        with:
            runner: imx93
        secrets:
            target_ip: ${{ secrets.IMX93_TARGET_IP }}
            target_password: ${{ secrets.IMX93_TARGET_PASSWORD }}
        needs:
            - changes
            - shellcheck
            - pylint
            - black
            - clang-format
            - clang-tidy

    on-target-tests-serial-imx93:
        if: needs.changes.outputs.full_ci == 'true'
        uses: ./.github/workflows/ci-conformance-on-target-serial.yml
        with:
            runner: imx93
            target_tty: /dev/ttyGEISA_imx93
        secrets:
            target_password: ${{ secrets.IMX93_TARGET_PASSWORD }}
        needs:
            - changes
            - shellcheck
            - pylint
            - black
            - clang-format
            - clang-tidy
            - on-target-tests-ssh-imx93
