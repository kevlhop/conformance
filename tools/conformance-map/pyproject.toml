[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geisa-conformance-map"
version = "0.1.0"
description = "Map GEISA requirements and contract rules to conformance tests"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "docutils>=0.21",
  "jsonschema>=4.23",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "pylint>=3.0",
  "pytest>=8.0",
]

[project.scripts]
geisa-conformance-map = "geisa_conformance_map.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
py-version = "3.11"
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 88
